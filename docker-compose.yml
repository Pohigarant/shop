services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "uv run python manage.py migrate &&
      uv run gunicorn shop1.wsgi:application
      --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - venv_data:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  venv_data:
