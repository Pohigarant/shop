services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "uv run python manage.py migrate &&
      uv run gunicorn shop1.wsgi:application
      --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - venv_data:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      #- REDIS_PORT=6379
      - EMAIL_HOST=smtp.mail.ru
      - EMAIL_PORT=465
      - EMAIL_USE_SSL=True
      - EMAIL_HOST_USER=Pohigarant@mail.ru
      - EMAIL_HOST_PASSWORD=Bpl6rVqUhTn9kI5pPS0y
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: uv run celery -A shop1 worker -l info
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - EMAIL_HOST=smtp.mail.ru
      - EMAIL_PORT=465
      - EMAIL_USE_SSL=True
      - EMAIL_HOST_USER=Pohigarant@mail.ru
      - EMAIL_HOST_PASSWORD=Bpl6rVqUhTn9kI5pPS0y
volumes:
  postgres_data:
  venv_data:
